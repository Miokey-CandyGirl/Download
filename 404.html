<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面不存在 · Lytalk</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-height: 100vh;
      background: linear-gradient(135deg, #F0FDFA 0%, #CCFBF1 50%, #F0FDFA 100%);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 0% 0%, rgba(94,234,212,0.18) 0%, transparent 50%),
        radial-gradient(ellipse at 100% 100%, rgba(45,212,191,0.12) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
      animation: bgShift 20s ease-in-out infinite alternate;
    }
    @keyframes bgShift {
      0%   { opacity: 0.7; }
      100% { opacity: 1; }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      padding: 40px 28px 32px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 40px rgba(20, 184, 166, 0.10);
      text-align: center;
    }

    .code {
      font-size: 72px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #5EEAD4, #0D9488);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 12px;
      letter-spacing: 4px;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      color: rgba(38, 38, 38, 0.88);
      margin-bottom: 8px;
    }

    .desc {
      font-size: 13px;
      color: rgba(38, 38, 38, 0.5);
      line-height: 1.6;
      margin-bottom: 26px;
    }

    .btn {
      display: inline-block;
      padding: 12px 28px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #2DD4BF, #0D9488);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(20, 184, 166, 0.3);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(20, 184, 166, 0.4);
    }
    .btn:active { transform: translateY(0) scale(0.98); }

    .footer {
      margin-top: 26px;
      font-size: 11px;
      color: rgba(38, 38, 38, 0.35);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <div class="title">页面走丢了</div>
    <div class="desc">
      你要找的页面可能已被移除、<br>
      改名，或暂时不可用。
    </div>
    <a class="btn" href="/">返回下载页</a>
    <div class="footer">© 2026 Lytalk · 青聊</div>
  </div>
</body>
</html>
