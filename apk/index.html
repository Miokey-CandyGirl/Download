<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>下载 Lytalk · 青聊</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-height: 100vh;
      background: linear-gradient(135deg, #F0FDFA 0%, #CCFBF1 50%, #F0FDFA 100%);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 0% 0%, rgba(94,234,212,0.18) 0%, transparent 50%),
        radial-gradient(ellipse at 100% 100%, rgba(45,212,191,0.12) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
      animation: bgShift 20s ease-in-out infinite alternate;
    }
    @keyframes bgShift {
      0%   { opacity: 0.7; }
      100% { opacity: 1; }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 36px 28px 28px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 40px rgba(20, 184, 166, 0.10);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .logo {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
      border-radius: 16px;
      background: linear-gradient(135deg, #2DD4BF, #0D9488);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(20, 184, 166, 0.28);
      color: #fff;
    }
    .logo svg { width: 30px; height: 30px; }

    .header-text .name {
      font-size: 18px;
      font-weight: 700;
      color: rgba(38, 38, 38, 0.9);
    }
    .header-text .sub {
      font-size: 12px;
      color: rgba(38, 38, 38, 0.5);
      margin-top: 3px;
    }

    .meta {
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(94, 234, 212, 0.08);
      font-size: 13px;
      color: rgba(38, 38, 38, 0.75);
      line-height: 1.8;
      margin-bottom: 18px;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .meta-row span:first-child { color: rgba(38, 38, 38, 0.45); }
    .meta-row span:last-child  { font-weight: 600; color: #0D9488; }

    .changelog {
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(94, 234, 212, 0.15);
      margin-bottom: 20px;
    }
    .changelog-title {
      font-size: 12px;
      font-weight: 600;
      color: rgba(38, 38, 38, 0.6);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    .changelog-list {
      font-size: 13px;
      color: rgba(38, 38, 38, 0.7);
      line-height: 1.8;
      padding-left: 18px;
    }
    .changelog-list li { margin-bottom: 2px; }

    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #2DD4BF, #0D9488);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(20, 184, 166, 0.3);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(20, 184, 166, 0.4);
    }
    .btn:active { transform: translateY(0) scale(0.98); }

    .hint {
      margin-top: 12px;
      font-size: 11px;
      color: rgba(38, 38, 38, 0.4);
      text-align: center;
      line-height: 1.6;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      font-size: 12px;
      color: rgba(38, 38, 38, 0.45);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back:hover { color: #0D9488; }

    .footer {
      margin-top: 22px;
      font-size: 11px;
      color: rgba(38, 38, 38, 0.35);
      text-align: center;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          <path d="M8 10h.01" stroke-width="3"/>
          <path d="M12 10h.01" stroke-width="3"/>
          <path d="M16 10h.01" stroke-width="3"/>
        </svg>
      </div>
      <div class="header-text">
        <div class="name">Lytalk 青聊</div>
        <div class="sub">Android 版 · 轻盈沟通，畅快生活</div>
      </div>
    </div>

    <div class="meta" id="metaBox">
      <div class="meta-row"><span>加载中...</span><span></span></div>
    </div>

    <div class="changelog" id="changelogBox" style="display:none;">
      <div class="changelog-title">本次更新</div>
      <ul class="changelog-list" id="changelogList"></ul>
    </div>

    <a class="btn" id="downloadBtn" style="display:none;" download>下载 APK</a>
    <div class="hint" id="hint"></div>

    <div style="text-align:center;">
      <a class="back" href="/">← 返回主页</a>
    </div>

    <div class="footer">© 2026 Lytalk · 青聊</div>
  </div>

  <script>
    (async function () {
      const metaBox = document.getElementById('metaBox')
      const changelogBox = document.getElementById('changelogBox')
      const changelogList = document.getElementById('changelogList')
      const btn = document.getElementById('downloadBtn')
      const hint = document.getElementById('hint')

      try {
        // ⚠️ 用绝对路径 /latest.json（页面在 /apk/ 子目录里）
        const res = await fetch('/latest.json?_=' + Date.now(), { cache: 'no-store' })
        if (!res.ok) throw new Error('fetch failed')
        const data = await res.json()

        metaBox.innerHTML = `
          <div class="meta-row"><span>版本</span><span>v${data.versionName}</span></div>
          <div class="meta-row"><span>更新日期</span><span>${data.updatedAt || '—'}</span></div>
        `

        if (data.changelog) {
          const lines = data.changelog.split('\\n').filter(l => l.trim())
          changelogList.innerHTML = lines.map(l => `<li>${l.trim()}</li>`).join('')
          changelogBox.style.display = 'block'
        }

        btn.href = data.url
        btn.setAttribute('download', data.url.split('/').pop())
        btn.style.display = 'block'
        btn.textContent = `下载 APK · v${data.versionName}`

        hint.textContent = '下载完成后，请在手机"下载"文件夹中点击 APK 安装'
      } catch (e) {
        metaBox.innerHTML = '<div class="meta-row"><span>暂时无法获取版本信息</span><span></span></div>'
      }
    })()
  </script>
</body>
</html>
