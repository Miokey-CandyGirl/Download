<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Lytalk 青聊 - Android 安装包下载</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #F0FDFA 0%, #E6FFFA 55%, #FFFFFF 100%);
      color: #1A1A1A;
      padding: 24px;
    }
    .card {
      max-width: 360px;
      width: 100%;
      background: #fff;
      border-radius: 24px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 16px 48px rgba(13, 148, 136, 0.12), 0 2px 10px rgba(0, 0, 0, 0.05);
    }
    .logo { width: 72px; height: 72px; object-fit: contain; }
    h1 { margin: 16px 0 4px; font-size: 22px; }
    .slogan { color: #14B8A6; font-size: 14px; font-weight: 500; }
    .ver { margin-top: 18px; color: #8C8C8C; font-size: 13px; }
    .ver b { color: #0D9488; }
    .btn {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 14px 0;
      border: none;
      border-radius: 14px;
      background: #0D9488;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover { background: #0F766E; }
    .hint { margin-top: 14px; color: #B0B0B0; font-size: 12px; line-height: 1.7; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://lytalk.rincatia.com/assets/logo.png" alt="Lytalk" onerror="this.style.display='none'" />
    <h1>Lytalk 青聊</h1>
    <p class="slogan">轻盈沟通，畅快生活</p>
    <p class="ver">Android 最新版本 <b id="ver">…</b></p>
    <a class="btn" href="./Lytalk.apk" download>下载安装包（APK）</a>
    <p class="hint">下载后请允许「安装未知应用」权限<br />也可以在 App 内「设置 → 检查更新」获取新版本</p>
  </div>
  <script>
    // 版本号与更新时间从 latest.json 读取，落地页无需手动同步
    fetch('./latest.json', { cache: 'no-store' })
      .then(r => { if (!r.ok) throw 0; return r.json() })
      .then(m => {
        document.getElementById('ver').textContent = 'v' + m.versionName
        document.querySelector('.btn').href = m.url || './Lytalk.apk'
      })
      .catch(() => { document.getElementById('ver').textContent = '获取失败，请直接点击下载' })
  </script>
</body>
</html>
